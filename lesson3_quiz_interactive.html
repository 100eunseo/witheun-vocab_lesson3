ric", "material", "design", "textile", "outfit"] }, { "sentence": "Children who develop healthy eating [ ___ ] early in life are less likely to suffer from weight-related health problems as adults.", "korean": "어린 시절부터 건강한 식습관을 개발하는 아이들은 어른이 되어서 체중 관련 건강 문제를 겪을 가능성이 낮다.", "answer": "habits", "distractors": ["practices", "methods", "approaches", "principles", "ideas"] }, { "sentence": "Artists often use recycled materials to [ ___ ] sculptures that draw attention to the problem of environmental waste.", "korean": "예술가들은 종종 환경 폐기물 문제에 주목을 끌기 위해 재활용 재료를 사용하여 조각품을 만든다.", "answer": "create", "distractors": ["produce", "develop", "design", "build", "demonstrate"] }, { "sentence": "Environmental campaigns urge people to [ ___ ] energy at home by turning off appliances they are not using.", "korean": "환경 캠페인은 사용하지 않는 가전제품을 끄는 방식으로 가정에서 에너지를 절약하도록 사람들에게 촉구한다.", "answer": "save", "distractors": ["reduce", "maintain", "limit", "minimize", "protect"] }, { "sentence": "Protecting the [ ___ ] from pollution and climate change is a responsibility that every generation must take seriously.", "korean": "오염과 기후 변화로부터 지구를 보호하는 것은 모든 세대가 진지하게 받아들여야 할 책임이다.", "answer": "Earth", "distractors": ["planet", "ocean", "environment", "soil", "nature"] }, { "sentence": "The average [ ___ ] of meat in developed countries is much higher than what nutrition experts consider healthy or sustainable.", "korean": "선진국에서 평균 육류 소비량은 영양 전문가들이 건강하거나 지속 가능하다고 생각하는 것보다 훨씬 높다.", "answer": "consumption", "distractors": ["production", "emission", "disposal", "extraction", "distribution"] }, { "sentence": "Learning a second language is certainly [ ___ ] the time and effort, as it opens new career and social opportunities.", "korean": "제2 외국어를 배우는 것은 새로운 직업 및 사회적 기회를 열어주기 때문에 시간과 노력을 기울일 가치가 있다.", "answer": "worth", "distractors": ["better", "greater", "harder", "more", "less"] }, { "sentence": "The global fashion industry is valued at over one [ ___ ] dollars, making it one of the largest industries in the world.", "korean": "글로벌 패션 산업은 1조 달러 이상의 가치를 지니고 있어 세계에서 가장 큰 산업 중 하나이다.", "answer": "trillion", "distractors": ["billion", "million", "thousand", "hundred", "considerable"] }, { "sentence": "The new building was [ ___ ] constructed using recycled materials, making it a model of sustainable architecture.", "korean": "새 건물은 완전히 재활용 재료를 사용하여 건설되어 지속 가능한 건축의 모델이 되었다.", "answer": "entirely", "distractors": ["gradually", "considerably", "significantly", "commonly", "currently"] }, { "sentence": "A traditional [ ___ ] economy follows a straight path: resources are extracted, used, and then discarded as waste.", "korean": "전통적인 선형 경제는 직선적인 경로를 따른다: 자원이 추출되고, 사용되고, 그 후 폐기물로 버려진다.", "answer": "linear", "distractors": ["circular", "sustainable", "eco-friendly", "renewable", "normal"] }, { "sentence": "The teacher used a hands-on [ ___ ] to help students understand difficult science concepts through simple experiments.", "korean": "그 교사는 학생들이 간단한 실험을 통해 어려운 과학 개념을 이해하도록 실습 중심의 접근 방식을 사용했다.", "answer": "approach", "distractors": ["method", "habit", "system", "principle", "direction"] } ] }; const COUNT = {1:20, 2:20, 3:20, 4:10}; const activeTypes = new Set([1,2,3,4]); const NUMS = ['①','②','③','④','⑤']; let questions = []; let submitted = false; let wrongOnly = false; let wrongWords = []; function toggleType(t) { if (activeTypes.has(t)) { if (activeTypes.size === 1) return; activeTypes.delete(t); } else { activeTypes.add(t); } document.querySelector(`[data-t="${t}"]`).classList.toggle('on', activeTypes.has(t)); } function shuffle(arr) { const a = [...arr]; for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; } function pick(arr, n) { return shuffle(arr).slice(0,n); } function makeChoices(correct, wrongs, n=5) { const pool = shuffle(wrongs).slice(0, n-1); const all = shuffle([correct, ...pool]); return { choices: all, ansIdx: all.indexOf(correct) }; } function buildType1(n) { const selected = pick(DATA.type1, n); const allM = DATA.type1.map(v=>v.meaning); return selected.map(item => { const wrongs = allM.filter(m=>m!==item.meaning); const {choices, ansIdx} = makeChoices(item.meaning, wrongs); return {type:1, word:item.word, choices, ansIdx, userAns:null}; }); } function buildType2(n) { const selected = pick(DATA.type2, n); const allSyn = DATA.type2.map(v=>v.syn); return selected.map(item => { const wrongs = allSyn.filter(s=>s!==item.syn); const {choices, ansIdx} = makeChoices(item.syn, wrongs); return {type:2, word:item.word, choices, ansIdx, userAns:null}; }); } function buildType3(n) { const selected = pick(DATA.type3, n); const allAnt = DATA.type3.map(v=>v.ant); return selected.map(item => { const wrongs = allAnt.filter(a=>a!==item.ant); const {choices, ansIdx} = makeChoices(item.ant, wrongs); return {type:3, word:item.word, choices, ansIdx, userAns:null}; }); } function buildType4(n) { const selected = pick(DATA.type4, n); return selected.map(item => { const dists = shuffle(item.distractors).slice(0,3); const box = shuffle([item.answer, ...dists]); return {type:4, sentence:item.sentence, korean:item.korean, box, answer:item.answer, userText:'', word: item.answer}; }); } 
function printWithAnswers() {
    const grid = document.getElementById('ak-grid');
    grid.innerHTML = questions.map((q, i) => {
        const ans = q.type <= 3
            ? NUMS[q.ansIdx] + ' ' + q.choices[q.ansIdx]
            : q.answer;
        return '<div class="ak-item"><span class="ak-num">' + (i+1) + '.</span><span class="ak-ans">' + ans + '</span></div>';
    }).join('');
    document.body.classList.add('print-with-answers');
    window.print();
    document.body.classList.remove('print-with-answers');
}
function generate(pool) { submitted = false; wrongOnly = false; let all = []; if (pool) { all = pool; } else { if (activeTypes.has(1)) all = all.concat(buildType1(COUNT[1])); if (activeTypes.has(2)) all = all.concat(buildType2(COUNT[2])); if (activeTypes.has(3)) all = all.concat(buildType3(COUNT[3])); if (activeTypes.has(4)) all = all.concat(buildType4(COUNT[4])); all = shuffle(all); } questions = all; render(); resetScore(); window.scrollTo({top:0, behavior:'smooth'}); } function generateWrongOnly() { wrongOnly = true; const pool = wrongWords.map(w => { if (w.type === 4) { const orig = DATA.type4.find(s => s.answer === w.word); if (!orig) return null; const dists = shuffle(orig.distractors).slice(0,3); const box = shuffle([orig.answer, ...dists]); return {type:4, sentence:orig.sentence, korean:orig.korean, box, answer:orig.answer, userText:'', word:orig.answer}; } else if (w.type === 1) { const item = DATA.type1.find(v=>v.word===w.word); if (!item) return null; const allM = DATA.type1.map(v=>v.meaning); const wrongs = allM.filter(m=>m!==item.meaning); const {choices, ansIdx} = makeChoices(item.meaning, wrongs); return {type:1, word:item.word, choices, ansIdx, userAns:null}; } else if (w.type === 2) { const item = DATA.type2.find(v=>v.word===w.word); if (!item) return null; const allSyn = DATA.type2.map(v=>v.syn); const wrongs = allSyn.filter(s=>s!==item.syn); const {choices, ansIdx} = makeChoices(item.syn, wrongs); return {type:2, word:item.word, choices, ansIdx, userAns:null}; } else if (w.type === 3) { const item = DATA.type3.find(v=>v.word===w.word); if (!item) return null; const allAnt = DATA.type3.map(v=>v.ant); const wrongs = allAnt.filter(a=>a!==item.ant); const {choices, ansIdx} = makeChoices(item.ant, wrongs); return {type:3, word:item.word, choices, ansIdx, userAns:null}; } return null; }).filter(Boolean); if (pool.length === 0) { alert('오답이 없습니다!'); return; } wrongWords = []; generate(shuffle(pool)); } function render() { const container = document.getElementById('quiz-container'); const total = questions.length; document.getElementById('quiz-count').textContent = `${total}문제`; const map = document.getElementById('q-map'); map.innerHTML = questions.map((q,i) => `<div class="q-dot" id="dot-${i}" onclick="scrollToQ(${i})">${i+1}</div>` ).join(''); const html = questions.map((q,i) => renderQ(q,i)).join(''); container.innerHTML = html; document.getElementById('submit-row').style.display = 'flex'; document.getElementById('submit-btn').disabled = false; document.getElementById('wrong-only-btn').style.display = 'none'; questions.forEach((q,i) => { if (q.type === 4) { const inp = document.getElementById(`inp-${i}`); if (inp) { inp.addEventListener('input', () => { q.userText = inp.value.trim(); updateDot(i, 'answered'); }); inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const next = document.getElementById(`inp-${i+1}`); if (next) next.focus(); } }); } } }); } function renderQ(q, i) { const typeNames = ['','뜻맞히기','동의어','반의어','빈칸쓰기']; const badgeClass = ['','b1','b2','b3','b4'][q.type]; const qLabels = [ '','다음 단어의 뜻으로 가장 적절한 것은?', '다음 단어의 동의어로 가장 적절한 것은?', '다음 단어의 반의어로 가장 적절한 것은?', '다음 문장에 빈칸에 들어갈 단어를 보기에서 골라 쓰시오.' ]; let body = ''; if (q.type <= 3) { const choicesHtml = q.choices.map((c,ci) => ` <button class="choice-btn" id="cb-${i}-${ci}" onclick="selectChoice(${i},${ci})" data-ci="${ci}"> <span class="c-num">${NUMS[ci]}</span>${c} </button>`).join(''); body = ` <div class="target-word">${q.word}</div> <div class="choices">${choicesHtml}</div> <div class="q-feedback" id="fb-${i}"></div>`; } else { body = ` <div class="type4-sentence">${q.sentence}</div> <div class="type4-korean">${q.korean}</div> <div class="box-wrap"> <div class="box-label">WORD BOX</div> <div class="word-box">${q.box.join(' &nbsp;/&nbsp; ')}</div> </div> <div class="type4-input-row"> <input class="type4-input" id="inp-${i}" type="text" placeholder="정답 입력..." autocomplete="off" spellcheck="false"> <span class="answer-reveal" id="ar-${i}"></span> </div> <div class="q-feedback" id="fb-${i}"></div>`; } return ` <div class="question" id="q-${i}"> <div class="q-meta"> <div class="q-num">${i+1}</div> <span class="q-badge ${badgeClass}">유형${q.type} ${typeNames[q.type]}</span> <span class="q-label">${qLabels[q.type]}</span> <span class="q-copyright">© Witheun by.은서쌤</span> </div> ${body} </div>`; } function selectChoice(qi, ci) { if (submitted) return; const q = questions[qi]; q.userAns = ci; for (let k=0; k<q.choices.length; k++) { const btn = document.getElementById(`cb-${qi}-${k}`); if (btn) btn.classList.toggle('selected', k === ci); } updateDot(qi, 'answered'); } function submitAll() { submitted = true; document.getElementById('submit-btn').disabled = true; wrongWords = []; let correct = 0, total = questions.length, answered = 0; questions.forEach((q,i) => { const fb = document.getElementById(`fb-${i}`); if (q.type <= 3) { const isAnswered = q.userAns !== null; answered += isAnswered ? 1 : 0; const isCorrect = q.userAns === q.ansIdx; q.choices.forEach((_,ci) => { const b = document.getElementById(`cb-${i}-${ci}`); if (!b) return; b.disabled = true; if (ci === q.ansIdx) b.classList.add('correct'); else if (ci === q.userAns && !isCorrect) b.classList.add('wrong'); }); if (isCorrect) { correct++; updateDot(i, 'ok'); if (fb) { fb.textContent = '✓ 정답!'; fb.className = 'q-feedback show ok'; } } else { updateDot(i, 'ng'); const correctText = q.choices[q.ansIdx]; if (fb) { fb.textContent = isAnswered ? `✗ 오답 — 정답: ${NUMS[q.ansIdx]} ${correctText}` : `✗ 미응답 — 정답: ${NUMS[q.ansIdx]} ${correctText}`; fb.className = 'q-feedback show ng'; } wrongWords.push({ type: q.type, word: q.word, mine: isAnswered ? q.choices[q.userAns] : '(미응답)', answer: correctText, typeLabel: ['','뜻맞히기','동의어','반의어'][q.type] }); } } else { const inp = document.getElementById(`inp-${i}`); const ar = document.getElementById(`ar-${i}`); if (inp) inp.disabled = true; const userT = (inp ? inp.value.trim() : '').toLowerCase(); const ansT = q.answer.toLowerCase(); const isCorrect = userT === ansT; answered += userT.length > 0 ? 1 : 0; if (isCorrect) { correct++; if (inp) inp.classList.add('correct-input'); updateDot(i, 'ok'); if (fb) { fb.textContent = '✓ 정답!'; fb.className = 'q-feedback show ok'; } } else { if (inp) inp.classList.add('wrong-input'); updateDot(i, 'ng'); if (ar) { ar.textContent = `→ ${q.answer}`; ar.classList.add('show'); } if (fb) { fb.textContent = userT.length > 0 ? `✗ 오답` : `✗ 미응답`; fb.className = 'q-feedback show ng'; } wrongWords.push({ type: 4, word: q.answer, mine: userT.length > 0 ? userT : '(미응답)', answer: q.answer, typeLabel: '빈칸쓰기' }); } } }); updateScore(correct, total); renderWrongList(); if (wrongWords.length > 0) { document.getElementById('wrong-only-btn').style.display = 'inline-flex'; } } function updateScore(correct, total) { const wrong = total - correct; const rate = total > 0 ? Math.round(correct/total*100) : 0; document.getElementById('sc-total').textContent = total; document.getElementById('sc-correct').textContent = correct; document.getElementById('sc-wrong').textContent = wrong; document.getElementById('sc-rate').textContent = rate + '%'; document.getElementById('prog-bar').style.width = rate + '%'; document.getElementById('prog-label').textContent = `${correct} / ${total} 정답`; } function resetScore() { ['sc-total','sc-correct','sc-wrong','sc-rate'].forEach(id => { document.getElementById(id).textContent = '—'; }); document.getElementById('prog-bar').style.width = '0%'; document.getElementById('prog-label').textContent = '채점 전'; document.getElementById('wrong-list').innerHTML = '<div class="empty-wrong">채점 후 오답이 표시됩니다.</div>'; } function renderWrongList() { const el = document.getElementById('wrong-list'); if (wrongWords.length === 0) { el.innerHTML = '<div class="empty-wrong">🎉 오답이 없습니다!</div>'; return; } el.innerHTML = wrongWords.map(w => ` <div class="wrong-item"> <div class="wi-type">유형${w.type} ${w.typeLabel}</div> <div class="wi-word">${w.word}</div> <div class="wi-detail"> 내 답: <span class="wi-mine">${w.mine}</span> &nbsp;→&nbsp; 정답: <span class="wi-ans">${w.answer}</span> </div> </div>`).join(''); } function updateDot(i, cls) { const dot = document.getElementById(`dot-${i}`); if (!dot) return; dot.className = 'q-dot ' + cls; } function scrollToQ(i) { const el = document.getElementById(`q-${i}`); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); } generate(); </script> </body> </html>
